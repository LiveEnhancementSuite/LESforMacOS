; LES Custom — Default Plugin Menu (Categorized)
;
; This file defines the plugin menu shown on double-right-click.
; Edit freely! Use "Scan Plugins..." from the LES menu bar to
; auto-detect installed AU/VST3 plugins and regenerate this file.
;
; Syntax:
;   /Category          — Create a category folder
;   //Subcategory      — Create a nested subfolder
;   ..                 — Go back one level
;   /nocategory        — Return to root level
;   --                 — Separator line
;   PluginName         — Display name (line 1)
;   "SearchQuery"      — Search query sent to Live (line 2)
;   End                — Required terminator
;
; Tip: Add "vst" at the end of a search query to filter for VST plugins.

