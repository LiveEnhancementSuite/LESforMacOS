name: CI

on:
  push:
    branches:
      - develop
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: macos-14
    permissions:
      contents: read
    env:
      IS_CI: 1

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 15.4
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare environment
        run: ./scripts/github-ci-pre.sh

      - name: Build for testing
        run: ./scripts/github-ci-testbuild.sh
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build.log
          path: artifacts/build.log

      - name: Run tests
        id: test
        run: ./scripts/github-ci-test.sh

      - name: Upload artifacts (test log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test.log
          path: artifacts/test.log
      - name: Upload artifacts (test results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_results
          path: build/reports/junit.xml

